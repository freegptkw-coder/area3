name: ARIA v3.0 - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - run: chmod +x ./gradlew
      - uses: gradle/wrapper-validation-action@v2

      - name: Assemble Debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK files
        if: always()
        run: |
          echo "=== APK Output Directory ==="
          ls -R app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
          echo ""
          echo "=== Build Outputs ==="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null && echo "APK files found" || echo "NO APK files generated"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-A30-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
