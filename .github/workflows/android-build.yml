name: Build Android APK v3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - name: Run Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

  build-debug:
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - run: chmod +x ./gradlew
      - uses: gradle/wrapper-validation-action@v3

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          BUILD_EXIT=$?
          
          echo ""
          echo "========== BUILD SUMMARY =========="
          echo "Exit code: $BUILD_EXIT"
          echo ""
          echo "--- Kotlin Errors ---"
          grep "^e:" /tmp/build.log | head -50 || echo "(none)"
          echo ""
          echo "--- Java Errors ---"
          grep "error:" /tmp/build.log | head -50 || echo "(none)"
          echo ""
          echo "--- Failed Tasks ---"
          grep "FAILED" /tmp/build.log | tail -20 || echo "(none)"
          echo ""
          echo "--- Top Exception ---"
          grep -A 5 "Exception" /tmp/build.log | head -30 || echo "(none)"
          
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "❌ BUILD FAILED - See error details above"
            exit 1
          fi
          
          echo "✅ BUILD SUCCESSFUL"
          exit 0

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-A30-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Show APK size
        if: always()
        run: |
          echo "APK files:"
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No APK found"
