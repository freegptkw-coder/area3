name: ARIA v3.0 - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - run: chmod +x ./gradlew
      - uses: gradle/wrapper-validation-action@v2

      - name: Assemble Debug
        id: gradle
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle-output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Show Build Output
        id: show_output
        if: always()
        run: |
          echo "========== GRADLE BUILD LOG =========="
          cat /tmp/gradle-output.log || echo "No log found"
          echo ""
          echo "========== APK FILES =========="
          ls -R app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
          echo "========== END LOG =========="

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log.txt
          path: /tmp/gradle-output.log
          retention-days: 30

      - name: Upload APK
        if: steps.show_output.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-A30-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Check Gradle Result
        run: |
          EXIT_CODE=${{ steps.gradle.outputs.exit_code }}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $EXIT_CODE. See build log artifact for details."
            apk_count=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | wc -l)
            if [ "$apk_count" -eq 0 ]; then
              echo "::error::No APK was generated by the build."
            fi
            exit $EXIT_CODE
          fi
          echo "✅ Build successful"
          ls -lh app/build/outputs/apk/debug/*.apk
